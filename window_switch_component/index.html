<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Window Switch Monitor</title>
</head>
<body>
<script>
(function () {
    let switchCount = 0;
    let resetToken = null;
    let initialized = false;
    let lastSwitchAt = 0;

    function send(type, extra) {
        window.parent.postMessage(
            Object.assign({ isStreamlitMessage: true, type }, extra || {}),
            "*"
        );
    }

    function onRender(event) {
        const message = event.data || {};
        if (message.type !== "streamlit:render") return;

        const args = message.args || {};
        const token = args.reset_token;
        const serverCount = Number(args.current_count || 0);

        if (!initialized || token !== resetToken) {
            resetToken = token;
            switchCount = serverCount;
            initialized = true;
            lastSwitchAt = 0;
        } else {
            switchCount = Math.max(switchCount, serverCount);
        }

        send("streamlit:setFrameHeight", { height: 0 });
    }

    function onVisibilityChange() {
        if (!initialized || !document.hidden) return;

        const now = Date.now();
        if (now - lastSwitchAt < 1500) return;

        lastSwitchAt = now;
        switchCount += 1;

        send("streamlit:setComponentValue", {
            value: switchCount,
            dataType: "json"
        });
    }

    window.addEventListener("message", onRender);
    document.addEventListener("visibilitychange", onVisibilityChange);
    send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
